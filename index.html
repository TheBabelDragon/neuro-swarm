<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#07090c" />
  <title>neuro-swarm</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand-block">
      <div class="brand">NEURO-SWARM</div>
      <div class="tagline">Physical swarm control platform</div>
    </div>
    <div class="header-meta">
      <span id="hdr-mode" class="pill idle">IDLE</span>
      <span id="hdr-conn" class="muted">—</span>
    </div>
  </header>

  <div class="toolbar">
    <button type="button" id="btn-demo" class="btn">Demo</button>
    <button type="button" id="btn-live" class="btn">Connect</button>
    <button type="button" id="btn-clear" class="btn ghost">Clear</button>
  </div>

  <main id="view-root" class="view-root"></main>

  <nav class="app-nav" aria-label="Primary">
    <button type="button" data-view="overview" class="nav-item active">Overview</button>
    <button type="button" data-view="fleet" class="nav-item">Fleet</button>
    <button type="button" data-view="aircraft" class="nav-item">Aircraft</button>
    <button type="button" data-view="radio" class="nav-item">Radio</button>
    <button type="button" data-view="lab" class="nav-item">Lab</button>
    <button type="button" data-view="system" class="nav-item">System</button>
  </nav>

  <p class="disclaimer">Synthetic demo values are labeled. Live hardware requires ground-station AP.</p>

  <script src="js/telemetry/schema.js"></script>
  <script src="js/telemetry/normalize.js"></script>
  <script src="js/telemetry/validate.js"></script>
  <script src="js/ground/aircraft-store.js"></script>
  <script src="js/ground/websocket.js"></script>
  <script src="js/ground/diagnostics.js"></script>
  <script src="js/app/router.js"></script>
  <script src="js/app/views.js"></script>
  <script src="js/app/app.js"></script>
</body>
</html>
